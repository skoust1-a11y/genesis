<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1c1917; }
    .box { fill: #fff; stroke: #44403c; stroke-width: 1.4; }
    .t { font-size: 13px; font-weight: 700; }
    .s { font-size: 11px; fill: #44403c; }
    .h { font-size: 16px; font-weight: 700; }
  </style>
  <rect width="1100" height="520" fill="#fafaf9"/>
  <text x="36" y="32" class="h">Review Crew</text>
  <text x="560" y="32" class="h">Trade Crew tick</text>
  <g id="review">
    <rect class="box" x="36" y="52" width="150" height="44" rx="4"/><text x="52" y="78" class="t">audit</text>
    <rect class="box" x="36" y="112" width="150" height="44" rx="4"/><text x="52" y="138" class="t">scenarios</text>
    <rect class="box" x="36" y="172" width="150" height="44" rx="4"/><text x="52" y="198" class="t">simulate</text>
    <rect class="box" x="36" y="232" width="150" height="44" rx="4"/><text x="52" y="258" class="t">hard stop sweep</text>
    <rect class="box" x="36" y="292" width="150" height="44" rx="4"/><text x="52" y="318" class="t">trade review</text>
    <rect class="box" x="36" y="352" width="150" height="44" rx="4"/><text x="52" y="378" class="t">verdict</text>
    <rect class="box" x="36" y="412" width="150" height="44" rx="4"/><text x="52" y="438" class="t">improve</text>
  </g>
  <text x="210" y="80" class="s">Missing entry, exit, or risk rules fail here.</text>
  <text x="210" y="200" class="s">NSE end-of-day data, or the bundled sample.</text>
  <text x="210" y="260" class="s">Does not change the verdict label.</text>
  <text x="210" y="440" class="s">Proposals need a human decision to apply.</text>
  <g id="trade">
    <rect class="box" x="560" y="52" width="150" height="36" rx="4"/><text x="576" y="74" class="t">verify</text>
    <rect class="box" x="730" y="52" width="150" height="36" rx="4"/><text x="746" y="74" class="t">gate</text>
    <rect class="box" x="900" y="52" width="150" height="36" rx="4"/><text x="916" y="74" class="t">hours</text>
    <rect class="box" x="560" y="110" width="150" height="36" rx="4"/><text x="576" y="132" class="t">observe</text>
    <rect class="box" x="730" y="110" width="150" height="36" rx="4"/><text x="746" y="132" class="t">reconcile</text>
    <rect class="box" x="900" y="110" width="150" height="36" rx="4"/><text x="916" y="132" class="t">exits</text>
    <rect class="box" x="560" y="168" width="150" height="36" rx="4"/><text x="576" y="190" class="t">drawdown</text>
    <rect class="box" x="730" y="168" width="150" height="36" rx="4"/><text x="746" y="190" class="t">daily target</text>
    <rect class="box" x="900" y="168" width="150" height="36" rx="4"/><text x="916" y="190" class="t">entry</text>
    <rect class="box" x="560" y="226" width="150" height="36" rx="4"/><text x="576" y="248" class="t">risk</text>
    <rect class="box" x="730" y="226" width="150" height="36" rx="4"/><text x="746" y="248" class="t">opinion</text>
    <rect class="box" x="900" y="226" width="150" height="36" rx="4"/><text x="916" y="248" class="t">explain</text>
    <rect class="box" x="730" y="284" width="150" height="36" rx="4"/><text x="746" y="306" class="t">execute</text>
  </g>
  <text x="560" y="360" class="s">verify through entry can end the tick early.</text>
  <text x="560" y="382" class="s">risk, opinion, explain, and execute always run once entry is reached.</text>
  <text x="560" y="404" class="s">opinion can skip or shrink an approved entry only in veto mode.</text>
  <text x="560" y="426" class="s">explain appends a note after the decision. It is not an input.</text>
  <text x="560" y="470" class="s">Hash mismatch, position mismatch, or a failed order halts the deployment.</text>
</svg>
