<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #1c1917; }
    .bg { fill: #fafaf9; }
    .box { fill: #ffffff; stroke: #44403c; stroke-width: 1.4; rx: 6px; }
    .grp-pre { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8px; }
    .grp-scan { fill: #f0fdf4; stroke: #22c55e; stroke-width: 1.5; rx: 8px; }
    .grp-trade { fill: #fefce8; stroke: #eab308; stroke-width: 1.5; rx: 8px; }
    .grp-exec { fill: #fdf4ff; stroke: #a855f7; stroke-width: 1.5; rx: 8px; }
    .grp-post { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.5; rx: 8px; }
    .agent-card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; rx: 5px; }
    .ln { stroke: #475569; stroke-width: 1.4; fill: none; marker-end: url(#arr); }
    .ln-dash { stroke: #64748b; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; marker-end: url(#arr); }
    .h { font-size: 20px; font-weight: 700; fill: #0f172a; }
    .sub { font-size: 13px; fill: #64748b; }
    .grp-title { font-size: 13.5px; font-weight: 700; }
    .agent-title { font-size: 11.5px; font-weight: 700; fill: #0f172a; }
    .agent-desc { font-size: 10px; fill: #475569; }
    .tag { font-size: 9.5px; font-weight: 600; fill: #4338ca; }
  </style>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1240" height="880" class="bg"/>

  <!-- Header -->
  <text x="40" y="38" class="h">Genesis: 5 Autonomous Trading Crews Ecosystem</text>
  <text x="40" y="58" class="sub">Complete Multi-Agent Quantitative Architecture for Indian Options (NIFTY / BANKNIFTY) · Coordinated by live_scanner.py</text>

  <!-- 1. PreMarketCrew -->
  <rect class="grp-pre" x="40" y="80" width="220" height="480"/>
  <text x="54" y="104" class="grp-title" fill="#1e40af">1. PreMarketCrew</text>
  <text x="54" y="120" class="sub" font-size="10.5px">Time: 08:30 - 09:14 IST</text>

  <!-- PreMarket Manager -->
  <rect class="box" x="52" y="132" width="196" height="52"/>
  <text x="62" y="152" class="agent-title">PreMarketManager</text>
  <text x="62" y="168" class="agent-desc">Coordinates agents &amp; plan</text>

  <!-- PreMarket Agents -->
  <rect class="agent-card" x="52" y="196" width="196" height="60"/>
  <text x="62" y="214" class="agent-title">GapAgent</text>
  <text x="62" y="230" class="agent-desc">GIFT NIFTY vs PDC gap bias</text>
  <text x="62" y="244" class="agent-desc">Calculates opening trap odds</text>

  <rect class="agent-card" x="52" y="268" width="196" height="60"/>
  <text x="62" y="286" class="agent-title">GammaAgent</text>
  <text x="62" y="302" class="agent-desc">Call/Put walls, PCR, Max Pain</text>
  <text x="62" y="316" class="agent-desc">Identifies dealer pinning zones</text>

  <rect class="agent-card" x="52" y="340" width="196" height="60"/>
  <text x="62" y="358" class="agent-title">EventRiskAgent</text>
  <text x="62" y="374" class="agent-desc">RBI MPC, CPI, FED, Earnings</text>
  <text x="62" y="388" class="agent-desc">Enforces event blackout window</text>

  <rect class="box" x="52" y="416" width="196" height="64" fill="#e0e7ff"/>
  <text x="62" y="434" class="agent-title" fill="#3730a3">Artifact: Battleplan</text>
  <text x="62" y="450" class="agent-desc">trades/pre_market_plan.json</text>
  <text x="62" y="466" class="agent-desc">Dispatched to Telegram (09:05)</text>

  <!-- Arrow PreMarket -> Scanner -->
  <path class="ln" d="M260 280 H280"/>

  <!-- 2. ScannerCrew -->
  <rect class="grp-scan" x="280" y="80" width="220" height="480"/>
  <text x="294" y="104" class="grp-title" fill="#166534">2. ScannerCrew</text>
  <text x="294" y="120" class="sub" font-size="10.5px">Time: 09:15 - 15:30 IST (1m/5m/15m)</text>

  <!-- Scanner Manager -->
  <rect class="box" x="292" y="132" width="196" height="52"/>
  <text x="302" y="152" class="agent-title">ScannerManager</text>
  <text x="302" y="168" class="agent-desc">Emits verified ScanSnapshots</text>

  <!-- Scanner Agents -->
  <rect class="agent-card" x="292" y="192" width="196" height="52"/>
  <text x="302" y="210" class="agent-title">FeedAgent</text>
  <text x="302" y="226" class="agent-desc">Delta-only 1m/5m/15m + VWAP</text>

  <rect class="agent-card" x="292" y="250" width="196" height="52"/>
  <text x="302" y="268" class="agent-title">LevelsAgent</text>
  <text x="302" y="284" class="agent-desc">PDH, PDL, OR-30 &amp; Round Strikes</text>

  <rect class="agent-card" x="292" y="308" width="196" height="52"/>
  <text x="302" y="326" class="agent-title">ConsolidationAgent</text>
  <text x="302" y="342" class="agent-desc">Midday compression &amp; ATR gate</text>

  <rect class="agent-card" x="292" y="366" width="196" height="52"/>
  <text x="302" y="384" class="agent-title">NewsAgent</text>
  <text x="302" y="400" class="agent-desc">Macro sentiment &amp; live headlines</text>

  <rect class="agent-card" x="292" y="424" width="196" height="60"/>
  <text x="302" y="442" class="agent-title">DetectorAgent</text>
  <text x="302" y="458" class="agent-desc">Sweeps, Trendline, Breakout</text>
  <text x="302" y="472" class="agent-desc">Validates micro-reclaim &amp; MSS</text>

  <rect class="box" x="292" y="492" width="196" height="56" fill="#dcfce7"/>
  <text x="302" y="510" class="agent-title" fill="#14532d">Artifact: ScanSnapshot</text>
  <text x="302" y="526" class="agent-desc">Actionable candidate setups</text>
  <text x="302" y="540" class="agent-desc">Passed to TradeManager</text>

  <!-- Arrow Scanner -> Trade -->
  <path class="ln" d="M500 280 H520"/>

  <!-- 3. TradeCrew -->
  <rect class="grp-trade" x="520" y="80" width="230" height="560"/>
  <text x="534" y="104" class="grp-title" fill="#854d0e">3. TradeCrew</text>
  <text x="534" y="120" class="sub" font-size="10.5px">Master Live Trading Decisions</text>

  <!-- Trade Manager -->
  <rect class="box" x="532" y="132" width="206" height="52"/>
  <text x="542" y="152" class="agent-title">TradeManager</text>
  <text x="542" y="168" class="agent-desc">Real-time state &amp; tick orchestrator</text>

  <rect class="agent-card" x="532" y="190" width="206" height="50"/>
  <text x="542" y="208" class="agent-title">TrendAgent</text>
  <text x="542" y="224" class="agent-desc">Macro trend slope &amp; R:R (+1.8 to 4.5R)</text>

  <rect class="agent-card" x="532" y="246" width="206" height="50"/>
  <text x="542" y="264" class="agent-title">RiskAgent &amp; SafetyWall</text>
  <text x="542" y="280" class="agent-desc">Max loss gate, 50% profit reserve</text>

  <rect class="agent-card" x="532" y="302" width="206" height="50"/>
  <text x="542" y="320" class="agent-title">OrderFlowAgent</text>
  <text x="542" y="336" class="agent-desc">Whale volume spikes &amp; trap veto</text>

  <rect class="agent-card" x="532" y="358" width="206" height="50"/>
  <text x="542" y="376" class="agent-title">EntryAgent</text>
  <text x="542" y="392" class="agent-desc">Micro-wicks &amp; strictly OTM contracts</text>

  <rect class="agent-card" x="532" y="414" width="206" height="50"/>
  <text x="542" y="432" class="agent-title">ExitAgent</text>
  <text x="542" y="448" class="agent-desc">Target 3 exit, 5M trail &amp; auto-flip</text>

  <rect class="agent-card" x="532" y="470" width="206" height="50"/>
  <text x="542" y="488" class="agent-title">AlertAgent &amp; JournalAgent</text>
  <text x="542" y="504" class="agent-desc">Telegram tickets &amp; SQLite WAL sync</text>

  <rect class="box" x="532" y="526" width="206" height="50" fill="#fef9c3"/>
  <text x="542" y="544" class="agent-title" fill="#713f12">TradeDecision Payload</text>
  <text x="542" y="560" class="agent-desc">Lots, Strike, Entry, SL, TP1-3</text>

  <!-- Arrow Trade -> Execution -->
  <path class="ln" d="M750 280 H770"/>

  <!-- 4. ExecutionCrew -->
  <rect class="grp-exec" x="770" y="80" width="210" height="480"/>
  <text x="784" y="104" class="grp-title" fill="#6b21a8">4. ExecutionCrew</text>
  <text x="784" y="120" class="sub" font-size="10.5px">Order Placement &amp; Slippage Routing</text>

  <!-- Execution Manager -->
  <rect class="box" x="782" y="132" width="186" height="52"/>
  <text x="792" y="152" class="agent-title">ExecutionManager</text>
  <text x="792" y="168" class="agent-desc">Live vs Paper execution routing</text>

  <rect class="agent-card" x="782" y="200" width="186" height="66"/>
  <text x="792" y="218" class="agent-title">SmartRoutingAgent</text>
  <text x="792" y="234" class="agent-desc">Tranche slicing (30%/70%)</text>
  <text x="792" y="248" class="agent-desc">Limit-chasing price improvement</text>

  <rect class="agent-card" x="782" y="280" width="186" height="66"/>
  <text x="792" y="298" class="agent-title">BrokerBridgeAgent</text>
  <text x="792" y="314" class="agent-desc">Multi-broker connector</text>
  <text x="792" y="328" class="agent-desc">Zero-slippage paper emulator</text>

  <rect class="agent-card" x="782" y="360" width="186" height="66"/>
  <text x="792" y="378" class="agent-title">ReconciliationAgent</text>
  <text x="792" y="394" class="agent-desc">Zero-drift state check</text>
  <text x="792" y="408" class="agent-desc">DB position == Broker position</text>

  <rect class="box" x="782" y="440" width="186" height="64" fill="#fae8ff"/>
  <text x="792" y="458" class="agent-title" fill="#581c87">ExecutionReceipt</text>
  <text x="792" y="474" class="agent-desc">Fills, exact slippage saved,</text>
  <text x="792" y="488" class="agent-desc">latency_ms &amp; order audit ID</text>

  <!-- Arrow Execution / Trade -> PostMarket -->
  <path class="ln" d="M980 280 H1000"/>

  <!-- 5. PostMarketCrew -->
  <rect class="grp-post" x="1000" y="80" width="200" height="480"/>
  <text x="1014" y="104" class="grp-title" fill="#9f1239">5. PostMarketCrew</text>
  <text x="1014" y="120" class="sub" font-size="10.5px">Time: 15:31+ IST (Autopsy &amp; Safety)</text>

  <!-- PostMarket Manager -->
  <rect class="box" x="1010" y="132" width="180" height="52"/>
  <text x="1020" y="152" class="agent-title">PostMarketManager</text>
  <text x="1020" y="168" class="agent-desc">Daily audit &amp; walk-forward</text>

  <rect class="agent-card" x="1010" y="192" width="180" height="52"/>
  <text x="1020" y="210" class="agent-title">AutopsyAgent</text>
  <text x="1020" y="226" class="agent-desc">Reconstructs tape &amp; audits exits</text>

  <rect class="agent-card" x="1010" y="250" width="180" height="52"/>
  <text x="1020" y="268" class="agent-title">ParameterAgent</text>
  <text x="1020" y="284" class="agent-desc">Walk-forward R:R &amp; sweep edges</text>

  <rect class="agent-card" x="1010" y="308" width="180" height="52"/>
  <text x="1020" y="326" class="agent-title">SafetyWallAgent</text>
  <text x="1020" y="342" class="agent-desc">Locks 50% profit, sets lot caps</text>

  <rect class="agent-card" x="1010" y="366" width="180" height="52"/>
  <text x="1020" y="384" class="agent-title">CodeQualityAgent</text>
  <text x="1020" y="400" class="agent-desc">Audits logs, latency, memory</text>

  <rect class="box" x="1010" y="426" width="180" height="56" fill="#ffe4e6"/>
  <text x="1020" y="444" class="agent-title" fill="#881337">BriefingAgent</text>
  <text x="1020" y="460" class="agent-desc">reports/daily_audit_*.md</text>
  <text x="1020" y="474" class="agent-desc">Telegram Executive Digest</text>

  <!-- Storage & Persistence Layer at Bottom -->
  <rect class="box" x="40" y="660" width="1160" height="180" fill="#f8fafc" stroke="#64748b"/>
  <text x="56" y="688" class="h" font-size="16px">Multi-Tier Persistence, SSOT Storage &amp; Reporting Synchronizer</text>
  <text x="56" y="706" class="sub">Atomic transactions, cryptographic provenance, and automated workbook generation</text>

  <!-- DB 1: Research DB -->
  <rect class="box" x="60" y="720" width="260" height="100"/>
  <text x="74" y="742" class="agent-title">Research DB (SQLite / Postgres)</text>
  <text x="74" y="760" class="agent-desc">genesis.db · Alembic migrations</text>
  <text x="74" y="776" class="agent-desc">Strategies, Ingest runs, Reports,</text>
  <text x="74" y="792" class="agent-desc">Simulated trades, SHA256 audit_events</text>

  <!-- DB 2: Live DB -->
  <rect class="box" x="340" y="720" width="260" height="100"/>
  <text x="354" y="742" class="agent-title">Live DB (SQLite / Postgres)</text>
  <text x="354" y="760" class="agent-desc">live.db · Alembic live migrations</text>
  <text x="354" y="776" class="agent-desc">Deployed strategies, Deployments,</text>
  <text x="354" y="792" class="agent-desc">Orders, Fills, live_audit_events</text>

  <!-- DB 3: Trade Store SSOT -->
  <rect class="box" x="620" y="720" width="270" height="100" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="634" y="742" class="agent-title" fill="#15803d">TradeStore SSOT (trades.db)</text>
  <text x="634" y="760" class="agent-desc">WAL-mode concurrent SQLite</text>
  <text x="634" y="776" class="agent-desc">live_and_forward_trades, PnL,</text>
  <text x="634" y="792" class="agent-desc">safety_wall_state, daily_risk_config</text>

  <!-- DB 4: Excel Workbooks -->
  <rect class="box" x="910" y="720" width="270" height="100" fill="#fef2f2" stroke="#dc2626"/>
  <text x="924" y="742" class="agent-title" fill="#b91c1c">trades/ Excel Workbooks</text>
  <text x="924" y="760" class="agent-desc">Maintained by maintain_trades_excel.py</text>
  <text x="924" y="776" class="agent-desc">live_and_forward_trades.xlsx</text>
  <text x="924" y="792" class="agent-desc">todays_live_trades.xlsx, by_strategy/</text>

  <!-- Flow arrows to Storage -->
  <path class="ln-dash" d="M635 640 V720"/>
  <path class="ln-dash" d="M1100 560 V720"/>
</svg>
