<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; fill: #1c1917; }
    .box { fill: #fff; stroke: #44403c; stroke-width: 1.4; }
    .grp { fill: #f5f5f4; stroke: #a8a29e; stroke-width: 1.2; }
    .ext { fill: #fff; stroke: #78716c; stroke-width: 1.2; stroke-dasharray: 5 3; }
    .ln { stroke: #44403c; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    .h { font-size: 18px; font-weight: 700; }
    .sub { font-size: 12px; fill: #57534e; }
    .t { font-size: 13px; font-weight: 700; }
    .s { font-size: 11px; fill: #44403c; }
    .l { font-size: 10.5px; fill: #57534e; }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#44403c"/>
    </marker>
  </defs>
  <rect width="1240" height="790" fill="#fafaf9"/>
  <text x="40" y="38" class="h">Trading Strategy Lab: architecture</text>
  <text x="40" y="58" class="sub">Processes, data stores and external services as implemented. Arrows show the direction data moves.</text>

  <!-- UI -->
  <rect class="box" x="40" y="76" width="1160" height="44" rx="6"/>
  <text x="56" y="103" class="t">Next.js UI · port 8842</text>
  <text x="250" y="103" class="s">/ dashboard  ·  /markets  ·  /lab  ·  /deploy  ·  /deployments</text>
  <text x="980" y="103" class="l">token and actor in localStorage</text>
  <path class="ln" d="M430 120 V150"/>
  <text x="440" y="140" class="l">HTTP JSON · Bearer token or X-Actor</text>

  <!-- API process -->
  <rect class="grp" x="40" y="150" width="780" height="210" rx="8"/>
  <text x="56" y="174" class="t">FastAPI process · port 8841</text>
  <text x="56" y="192" class="s">CORS → audit context (X-Request-ID, X-Actor) → optional Bearer auth (API_TOKENS) → routers</text>
  <text x="56" y="208" class="s">Also: journal, trade reviews, improvement decisions, CSV export, /api/audit/verify and /api/live/audit/verify</text>

  <rect class="box" x="60" y="224" width="170" height="120" rx="6"/>
  <text x="72" y="246" class="t">Market + paper orders</text>
  <text x="72" y="266" class="s">/api/market quotes, candles</text>
  <text x="72" y="282" class="s">/api/paper orders, positions</text>
  <text x="72" y="298" class="s">Indian charges, no exchange</text>
  <text x="72" y="322" class="l">calls Yahoo Finance</text>

  <rect class="box" x="250" y="224" width="170" height="120" rx="6"/>
  <text x="262" y="246" class="t">Ingest + extract</text>
  <text x="262" y="266" class="s">/api/ingest/extract, clarify</text>
  <text x="262" y="282" class="s">/api/demo/run</text>
  <text x="262" y="298" class="s">fetch source, LLM extract</text>
  <text x="262" y="322" class="l">calls source sites, LLM</text>

  <rect class="box" x="440" y="224" width="170" height="120" rx="6"/>
  <text x="452" y="246" class="t">Review Crew</text>
  <text x="452" y="266" class="s">/api/review/run, LangGraph</text>
  <text x="452" y="282" class="s">audit, scenarios, simulate,</text>
  <text x="452" y="298" class="s">hard stop, verdict, improve</text>
  <text x="452" y="322" class="l">reads Market DB · LLM note</text>

  <rect class="box" x="630" y="224" width="170" height="120" rx="6"/>
  <text x="642" y="246" class="t">Live control</text>
  <text x="642" y="266" class="s">/api/live: approve, backtest</text>
  <text x="642" y="282" class="s">start, pause, stop, flatten</text>
  <text x="642" y="298" class="s">equity, money, odds, veto</text>
  <text x="642" y="322" class="l">reads Market DB · brokers</text>

  <!-- Background processes -->
  <rect class="grp" x="860" y="150" width="340" height="210" rx="8"/>
  <text x="876" y="174" class="t">Background processes</text>
  <text x="876" y="192" class="s">The API process never ticks a crew.</text>
  <rect class="box" x="880" y="204" width="300" height="52" rx="6"/>
  <text x="896" y="226" class="t">Supervisor</text>
  <text x="896" y="244" class="s">python -m app.live supervise · restarts with backoff</text>
  <path class="ln" d="M1030 256 V280"/>
  <text x="1040" y="273" class="l">one subprocess per started deployment</text>
  <rect class="box" x="880" y="280" width="300" height="64" rx="6"/>
  <text x="896" y="302" class="t">Trade Crew (LangGraph tick)</text>
  <text x="896" y="320" class="s">Rules decide in code. The LLM may only skip or</text>
  <text x="896" y="336" class="s">shrink an approved entry, in veto mode.</text>

  <!-- writes -->
  <path class="ln" d="M145 344 V470"/>
  <text x="151" y="418" class="l">paper_orders</text>
  <path class="ln" d="M335 344 V470"/>
  <text x="341" y="418" class="l">ingest runs, versions</text>
  <path class="ln" d="M525 344 V470"/>
  <text x="531" y="418" class="l">reports, trades, reviews</text>
  <path class="ln" d="M715 344 V470"/>
  <text x="721" y="418" class="l">frozen snapshot</text>
  <path class="ln" d="M920 344 V470"/>
  <text x="926" y="418" class="l">intents, orders, fills</text>
  <path class="ln" d="M1100 470 V344"/>
  <text x="1106" y="418" class="l">prev range, VIX</text>

  <!-- data stores -->
  <rect class="box" x="60" y="470" width="550" height="82" rx="14"/>
  <text x="76" y="494" class="t">Research DB · DATABASE_URL · Alembic</text>
  <text x="76" y="512" class="s">strategies, versions, ingest runs, reports, simulation runs, sim trades, trade reviews,</text>
  <text x="76" y="528" class="s">improvements, paper_orders · hash-chained audit_events (approval events too)</text>
  <text x="76" y="544" class="l">SQLite by default, Postgres optional</text>

  <rect class="box" x="630" y="470" width="330" height="82" rx="14"/>
  <text x="646" y="494" class="t">Live DB · LIVE_DATABASE_URL · Alembic</text>
  <text x="646" y="512" class="s">deployments, intents, orders, fills, live trades,</text>
  <text x="646" y="528" class="s">credentials (Fernet), heartbeats, opinions</text>
  <text x="646" y="544" class="l">hash-chained live_audit_events</text>

  <rect class="box" x="980" y="470" width="220" height="82" rx="14"/>
  <text x="996" y="494" class="t">Market DB · not audited</text>
  <text x="996" y="512" class="s">NSE EOD bars, option closes,</text>
  <text x="996" y="528" class="s">events, news headlines</text>
  <text x="996" y="544" class="l">read by review, backtest, crew</text>

  <!-- externals -->
  <text x="40" y="592" class="t">External services, each used only when configured</text>
  <rect class="ext" x="40" y="604" width="180" height="78" rx="6"/>
  <text x="52" y="626" class="t">Source sites</text>
  <text x="52" y="644" class="l">YouTube transcripts, Instagram,</text>
  <text x="52" y="659" class="l">HTML pages (PDF refused)</text>
  <text x="52" y="674" class="l">used by ingest</text>

  <rect class="ext" x="238" y="604" width="180" height="78" rx="6"/>
  <text x="250" y="626" class="t">OpenAI or Anthropic</text>
  <text x="250" y="644" class="l">LLM_PROVIDER, temperature 0</text>
  <text x="250" y="659" class="l">extract, rationale, opinion,</text>
  <text x="250" y="674" class="l">lessons, explain notes</text>

  <rect class="ext" x="436" y="604" width="180" height="78" rx="6"/>
  <text x="448" y="626" class="t">Yahoo Finance</text>
  <text x="448" y="644" class="l">delayed quotes and candles</text>
  <text x="448" y="659" class="l">per request, not cached</text>
  <text x="448" y="674" class="l">no MCX feed</text>

  <rect class="ext" x="634" y="604" width="180" height="78" rx="6"/>
  <text x="646" y="626" class="t">Paper or Sandbox broker</text>
  <text x="646" y="644" class="l">adapter registry per account</text>
  <text x="646" y="659" class="l">Trade Crew orders and stops</text>
  <text x="646" y="674" class="l">no exchange adapter yet</text>

  <rect class="ext" x="832" y="604" width="180" height="78" rx="6"/>
  <text x="844" y="626" class="t">NSE archives</text>
  <text x="844" y="644" class="l">bhavcopies, index, India VIX</text>
  <text x="844" y="659" class="l">import scripts, run by hand</text>
  <text x="844" y="674" class="l">write the Market DB</text>

  <rect class="ext" x="1030" y="604" width="170" height="78" rx="6"/>
  <text x="1042" y="626" class="t">Telegram or SMTP</text>
  <text x="1042" y="644" class="l">alerts: halt, pause, stop,</text>
  <text x="1042" y="659" class="l">floor, withdrawal due</text>
  <text x="1042" y="674" class="l">off when unset</text>

  <text x="40" y="716" class="s">Every order comes from rules checked in code. An LLM never opens or closes a trade.</text>
  <text x="40" y="734" class="s">Rows are append-only (ORM and triggers) except strategies, which can be archived, and the Market DB, whose importers can be re-run.</text>
  <text x="40" y="752" class="s">Langfuse is named in .env.example and is not called. vendor/TradingAgents is a reference tree; the application does not import it.</text>
</svg>
