  <!-- Invariants & Security Footer -->
  <text x="40" y="760" class="s">Core Invariant: Trading orders are strictly executed by deterministic algorithms in code. The LLM has zero trade initiation authority.</text>
  <text x="40" y="778" class="s">Risk Management: 3-Tier Execution Framework (3 Lots 1-OTM, 4 Lots 2-OTM Super-Trend, 2 Lots ATM) with 50% Capital Safety Wall protection.</text>
  <text x="40" y="796" class="s">Provenance: Immutable frozen strategy SHA256 hashes verified on every tick. Dual append-only cryptographic hash chains ensure non-repudiation.</text>
